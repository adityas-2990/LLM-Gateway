# Local development profile. Targets the services in the repo-root docker-compose.yml.
# Run with: ./gradlew bootRun --args='--spring.profiles.active=local'
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gateway
    username: gateway
    password: gateway

  jpa:
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.adisrivastava.gateway: DEBUG
