spring:
  application:
    name: gateway

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gateway}
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway}

  jpa:
    open-in-view: false
    hibernate:
      # validate, never update: Flyway owns the schema. Hibernate only checks that
      # the entities match what the migrations built, and refuses to start if not.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
